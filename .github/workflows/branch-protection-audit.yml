name: branch-protection-audit

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report intended action without changing branch protection"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: branch-protection-audit
  cancel-in-progress: false

jobs:
  restore-review-gate:
    # Secret access is enforced by the environment's server-side rules.
    # This condition keeps the unconfigured audit inactive; it is not an auth gate.
    if: github.ref == 'refs/heads/main' && vars.BRANCH_PROTECTION_AUDIT_ENABLED == 'true'
    environment: branch-protection-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved audit revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          # Bind code to the reviewed run, rather than a branch tip that can move.
          ref: ${{ github.sha }}

      - name: Workflow Action Pin Guardrail
        run: |
          cd "$GITHUB_WORKSPACE"
          ./scripts/check_action_pins.sh "$GITHUB_WORKSPACE"

      - name: Audit Branch Protection
        env:
          GITHUB_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || github.token }}
          BRANCH_PROTECTION_TOKEN_PRESENT: ${{ secrets.BRANCH_PROTECTION_TOKEN != '' }}
          BRANCH_PROTECTION_BRANCH: main
          BRANCH_PROTECTION_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 ./scripts/branch_protection_audit.py
